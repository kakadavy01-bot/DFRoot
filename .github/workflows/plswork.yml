name: Build dirtyfrag APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Install NDK 30
        run: |
          sdkmanager --install "ndk;30.0.16138531" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/30.0.16138531" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/30.0.16138531" >> $GITHUB_ENV
      - name: Build APK
        run: |
          chmod +x ./build.sh ./gradlew
          ./build.sh
          ls -lh *.apk app/build/outputs/apk/debug/ || true
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dirtyfrag-apk
          path: |
            *.apk
            app/build/outputs/apk/**/*.apk
          if-no-files-found: error
